# =========================================================
# Clash Verge Rev / Mihomo
# 越南 -> 中国
# TUN + GLOBAL 全局回国优化版
#
# 适用：
# - Windows
# - Clash Verge Rev
# - Mihomo
# - 中国后台
# - 摄像头
# - 监控视频
# - IoT
# - 国内应用
#
# 建议：
# Clash Verge：
#   TUN = 开启
#   模式 = 全局 / Global
#
# GLOBAL 中选择：
#   🇨🇳 回国节点
# =========================================================


# =========================================================
# 1. 基础设置
# =========================================================

port: 7897
socks-port: 7891
mixed-port: 7893

allow-lan: false

# 默认规则模式。
# Clash Verge 界面选择 GLOBAL 后会使用全局模式。
mode: rule

log-level: info

external-controller: 127.0.0.1:9090
secret: ""

unified-delay: true

# 并发建立 TCP 连接
tcp-concurrent: true

find-process-mode: strict

profile:
  store-selected: true


# =========================================================
# 2. TUN
#
# 摄像头/视频场景优先测试 system
# =========================================================

tun:
  enable: true

  stack: system

  auto-route: true
  auto-detect-interface: true

  strict-route: true

  # 接管系统 DNS
  dns-hijack:
    - any:53
    - tcp://any:53


# =========================================================
# 3. 流量嗅探
#
# 帮助 Mihomo 从连接中识别域名
# =========================================================

sniffer:
  enable: true

  parse-pure-ip: true

  override-destination: false

  sniff:

    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443


# =========================================================
# 4. DNS
#
# 核心原则：
#
# 不再使用：
#   Google DNS
#   Cloudflare DNS
#
# 使用：
#   阿里 DNS
#   腾讯 DNSPod
#
# enhanced-mode：
#   redir-host
#
# 相比 fake-ip，
# 对摄像头 / IoT / P2P / 国内软件兼容性更友好。
# =========================================================

dns:
  enable: true

  listen: 127.0.0.1:1053

  ipv6: false

  enhanced-mode: redir-host

  use-system-hosts: true

  respect-rules: true


  # =======================================================
  # 基础 DNS
  # =======================================================

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29


  # =======================================================
  # 主 DNS
  #
  # 阿里 DNS
  # 腾讯 DNSPod
  # =======================================================

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


  # =======================================================
  # 代理节点域名解析
  #
  # 代理服务器本身不要通过代理去解析
  # 避免循环解析。
  # =======================================================

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29



