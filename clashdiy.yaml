# =========================================================
# 7. 路由规则
#
# 注意：
#
# 【规则模式 Rule】
#
# 只有：
# 160.202.240.122:3333
#
# 走中国。
#
# 其他全部 DIRECT。
#
#
# 【全局模式 Global】
#
# 规则不会决定最终出口，
# Clash Verge 的 GLOBAL 选择器决定出口。
#
# 如果 GLOBAL 选择：
# 🇨🇳 深圳-香港中转
#
# 那整个电脑都会走深圳回国节点。
# =========================================================

rules:


  # =======================================================
  # 局域网
  # =======================================================

  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT


  # =======================================================
  # 指定后台
  #
  # http://160.202.240.122:3333/#/login
  #
  # Hash：
  # #/login
  #
  # 不属于网络请求的一部分，
  # Clash 不需要匹配。
  # =======================================================

  - AND,((IP-CIDR,160.202.240.122/32),(DST-PORT,3333)),🇨🇳 回国节点


  # =======================================================
  # 其他全部直连
  # =======================================================

  - MATCH,DIRECT
