# =========================================================
# 6. 策略组
# =========================================================

proxy-groups:


  # =======================================================
  # 主回国节点
  #
  # 建议摄像头测试期间：
  #
  # 不使用自动选择
  #
  # 手动尝试：
  #
  # 深圳-香港中转
  # 上海-香港中转
  # 绍兴-香港中转
  # 北京-香港中转
  #
  # 哪一个视频最快就固定哪一个。
  # =======================================================

  - name: "🇨🇳 回国节点"

    type: select

    proxies:

      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳-东亚中转"
      - "🇨🇳 深圳"

      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海-东亚中转"
      - "🇨🇳 上海"

      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴-南亚中转"
      - "🇨🇳 绍兴-东亚中转"
      - "🇨🇳 绍兴"

      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京-南亚中转"
      - "🇨🇳 北京-东亚中转"
      - "🇨🇳 北京"

      - "⚡ 回国自动选择"
      - "🛟 回国故障转移"



  # =======================================================
  # 自动测速
  # =======================================================

  - name: "⚡ 回国自动选择"

    type: url-test

    proxies:

      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳-东亚中转"
      - "🇨🇳 深圳"

      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海-东亚中转"
      - "🇨🇳 上海"

      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴-南亚中转"
      - "🇨🇳 绍兴-东亚中转"
      - "🇨🇳 绍兴"

      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京-南亚中转"
      - "🇨🇳 北京-东亚中转"
      - "🇨🇳 北京"

    url: "http://www.gstatic.com/generate_204"

    interval: 300

    tolerance: 50

    lazy: true



  # =======================================================
  # 故障转移
  # =======================================================

  - name: "🛟 回国故障转移"

    type: fallback

    proxies:

      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳"

      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海"

      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴-南亚中转"
      - "🇨🇳 绍兴"

      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京-南亚中转"
      - "🇨🇳 北京"

    url: "http://www.gstatic.com/generate_204"

    interval: 300

    lazy: true



# =========================================================
# 7. 路由规则
#
# 这部分主要作为 Rule 模式的保险。
#
# GLOBAL 模式：
# Clash Verge 会直接使用 GLOBAL。
#
# 如果不小心切换到 Rule：
# 除局域网之外，仍然全部走回国节点。
# =========================================================

rules:


  # =======================================================
  # 本地局域网保持直连
  #
  # 例如：
  # 192.168.x.x
  # 10.x.x.x
  # 本地打印机
  # NAS
  # 路由器
  # =======================================================

  - GEOSITE,private,DIRECT

  - GEOIP,LAN,DIRECT


  # =======================================================
  # 其他所有互联网流量全部回国
  # =======================================================

  - MATCH,🇨🇳 回国节点
