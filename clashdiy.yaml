# =========================================================
# Clash Verge Rev / Mihomo
# 越南 -> 中国 回国专用配置
#
# 使用场景：
# 1. Windows + Clash Verge Rev
# 2. 开启 TUN 模式
# 3. 全局模式时：整个电脑翻回中国
# 4. 规则模式时：仅 160.202.240.122:3333 回国
# 5. 针对摄像头 / IoT / 国内监控平台优化
#
# DNS：
# - 阿里 DNS
# - 腾讯 DNSPod
#
# DNS 模式：
# - redir-host
#   避免部分摄像头、IoT、WebRTC、P2P 与 Fake-IP 不兼容
# =========================================================


# =========================================================
# 1. 基础参数
# =========================================================

port: 7897
socks-port: 7891
mixed-port: 7893

allow-lan: false

# 配置文件默认采用规则模式
# 如果 Clash Verge 界面切换为“全局”，GUI 会使用 GLOBAL
mode: rule

log-level: info

external-controller: 127.0.0.1:9090
secret: ""

unified-delay: true
tcp-concurrent: true

find-process-mode: strict

profile:
  store-selected: true


# =========================================================
# 2. TUN
# =========================================================

tun:
  enable: true

  # Windows 推荐 mixed
  stack: mixed

  auto-route: true
  auto-detect-interface: true

  # 防止部分流量绕过 TUN
  strict-route: true

  # 强制程序 DNS 请求交给 Mihomo
  dns-hijack:
    - any:53
    - tcp://any:53


# =========================================================
# 3. 流量嗅探
# =========================================================

sniffer:
  enable: true

  # 对纯 IP 流量尝试识别域名
  parse-pure-ip: true

  # 使用识别出来的域名覆盖目标
  override-destination: false

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443


# =========================================================
# 4. DNS
#
# 摄像头兼容重点：
#
# 不使用：
#   fake-ip
#
# 改成：
#   redir-host
#
# 这样访问摄像头、P2P、IoT、国内设备平台时
# 一般比 Fake-IP 兼容性更好。
# =========================================================

dns:
  enable: true

  listen: 127.0.0.1:1053

  ipv6: false

  enhanced-mode: redir-host

  use-system-hosts: true

  respect-rules: true


  # -------------------------------------------------------
  # 基础 DNS
  #
  # 这里必须使用纯 IP DNS
  # -------------------------------------------------------

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29


  # -------------------------------------------------------
  # 主 DNS
  #
  # 阿里 DNS + 腾讯 DNSPod
  # -------------------------------------------------------

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query


  # -------------------------------------------------------
  # 节点服务器域名解析
  #
  # 用于：
  # *.ednovas.life
  # *.nmsl.sb
  # *.ednovas.cloud
  #
  # 防止解析代理节点本身时形成 DNS 问题
  # -------------------------------------------------------

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29


