# =========================================================
# 越南使用 - 指定后台单独回国
#
# 目标：
# 1. 160.202.240.122:3333 -> 中国回国节点
# 2. 其他所有流量 -> DIRECT
# 3. 回国节点支持手动选择 + 自动测速
# 4. 测速地址：
#    http://www.gstatic.com/generate_204
#
# 适用：
# Clash Verge Rev / Mihomo
# =========================================================


# =========================================================
# 1. 核心基础参数
# =========================================================

port: 7897
socks-port: 7891
mixed-port: 7893

allow-lan: false
mode: rule
log-level: info

external-controller: 127.0.0.1:9090
secret: ""

unified-delay: true
tcp-concurrent: true
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true


# =========================================================
# 2. TUN
#
# 默认关闭。
# 如果后面你希望 Clash Verge 接管所有程序流量，
# 可以在客户端中开启 TUN。
# =========================================================

tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true


# =========================================================
# 3. 流量嗅探
# =========================================================

sniffer:
  enable: true
  parse-pure-ip: true

  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880

    TLS:
      ports:
        - 443
        - 8443

    QUIC:
      ports:
        - 443


# =========================================================
# 4. DNS
#
# 由于你的目标后台直接使用 IP：
# 160.202.240.122
#
# 所以访问这个后台本身不依赖 DNS。
# DNS 主要用于其他正常直连网站。
# =========================================================

dns:
  enable: true
  listen: 127.0.0.1:1053

  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  use-system-hosts: true
  respect-rules: true

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - https://cloudflare-dns.com/dns-query
    - https://dns.google/dns-query

  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  fake-ip-filter:
    - "*.lan"
    - "+.local"
    - "localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "captive.apple.com"


