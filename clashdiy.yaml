# =========================================================
# 6. 策略组
# =========================================================

proxy-groups:

  # =======================================================
  # 主回国策略
  #
  # 平时直接在 Clash Verge 中选择这里。
  #
  # 默认：
  # ⚡ 回国自动选择
  #
  # 也可以手动选择深圳 / 上海 / 北京 / 绍兴。
  # =======================================================

  - name: "🇨🇳 回国节点"
    type: select
    proxies:
      - "⚡ 回国自动选择"
      - "🛟 回国故障转移"

      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳-东亚中转"
      - "🇨🇳 深圳"

      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海-东亚中转"
      - "🇨🇳 上海"

      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴-南亚中转"
      - "🇨🇳 绍兴-东亚中转"
      - "🇨🇳 绍兴"

      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京-南亚中转"
      - "🇨🇳 北京-东亚中转"
      - "🇨🇳 北京"


  # =======================================================
  # 自动测速
  #
  # 每 5 分钟测速一次。
  # tolerance 50 = 延迟差距不足 50ms 时不频繁切换。
  # =======================================================

  - name: "⚡ 回国自动选择"
    type: url-test

    proxies:
      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳-东亚中转"
      - "🇨🇳 深圳"

      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海-东亚中转"
      - "🇨🇳 上海"

      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴-南亚中转"
      - "🇨🇳 绍兴-东亚中转"
      - "🇨🇳 绍兴"

      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京-南亚中转"
      - "🇨🇳 北京-东亚中转"
      - "🇨🇳 北京"

    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true


  # =======================================================
  # 故障转移
  #
  # 当前节点不可用时自动切换。
  # =======================================================

  - name: "🛟 回国故障转移"
    type: fallback

    proxies:
      - "🇨🇳 深圳-香港中转"
      - "🇨🇳 深圳-南亚中转"
      - "🇨🇳 深圳"
      - "🇨🇳 上海-香港中转"
      - "🇨🇳 上海-南亚中转"
      - "🇨🇳 上海"
      - "🇨🇳 绍兴-香港中转"
      - "🇨🇳 绍兴"
      - "🇨🇳 北京-香港中转"
      - "🇨🇳 北京"

    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true


# =========================================================
# 7. 路由规则
# =========================================================

rules:

  # =======================================================
  # 局域网直连
  # =======================================================

  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT


  # =======================================================
  # 唯一需要翻回中国的地址
  #
  # 原地址：
  #
  # http://160.202.240.122:3333/#/login
  #
  # Clash 实际只需要识别：
  #
  # IP：
  # 160.202.240.122
  #
  # 端口：
  # 3333
  #
  # #/login 属于浏览器 Hash Router，
  # 不参与网络路由匹配。
  # =======================================================

  - AND,((IP-CIDR,160.202.240.122/32),(DST-PORT,3333)),🇨🇳 回国节点


  # =======================================================
  # 最终兜底
  #
  # 除上述 IP:3333 外：
  #
  # Google
  # ChatGPT
  # YouTube
  # Facebook
  # Zalo
  # Microsoft
  # Apple
  # 越南网站
  # 中国网站
  # 国际网站
  #
  # 全部使用越南本地网络。
  # =======================================================

  - MATCH,DIRECT
